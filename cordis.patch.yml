# Configuration layer of the `dsh-voice-input` bundle.
#
# ONE row, because Cordis parks a row until every service it declares exists and
# the boot audit fails on any entry left pending. The row hard-depends on
# shell/tools/fs (present in every base-backed profile) and DEFERS its browser
# route with `ctx.inject(['webServer'])`, so:
#
#   Web profile       tool + microphone route
#   headless / SDK    tool only, no pending entry, boot stays green
#
# Every field carries this plugin's own default, so most users never touch this
# layer: override the row from your profile's `cordis.patch.yml` instead. A row's
# whole `config` is replaced, never deep-merged, so restate every key you want.

- insert:
    - id: voice-input
      name: dsh-voice-input
      config:
        # Model size or name. `base.en` is ~150 MB and decodes about 6 s of
        # speech per second of CPU on a modern laptop. `small.en` is roughly
        # three times the compute for noticeably better accuracy.
        model: base.en
        # Spoken language code, or `auto` to detect it (multilingual models).
        language: en
        # Transcription engine.
        #
        #   auto            the bundled whisper.cpp (Vulkan) engine when it is
        #                   installed, otherwise faster-whisper
        #   ggml            require whisper.cpp; report the reason if it is
        #                   unavailable instead of silently using the CPU
        #   faster-whisper  CTranslate2 only (CUDA when a CUDA card is present)
        #
        # PINNED TO THE CPU ENGINE ON THIS MACHINE. The measure is not raw speed:
        #
        #   faster-whisper, warm      ~0.33-0.5 s per recording, and partial text
        #                             appears WHILE the audio is still decoding
        #   whisper.cpp/Vulkan, warm  ~0.1-0.2 s, but the transcript arrives in
        #                             one update at the end, and the first run
        #                             after a driver cache reset costs 1.7-3.3 s
        #                             of Vulkan pipeline compilation
        #
        # Sub-second either way means the launch cost is gone; what is left is
        # which behaviour feels better. Progressive text wins for a recording of
        # any length, and the CPU path holds no GPU state at all, so it cannot
        # accumulate VRAM or wedge a driver. Set `backend: auto` to bring the
        # GPU engine back (it is still bundled and works).
        backend: faster-whisper
        # Model for the whisper.cpp engine, in GGML format. This is a DIFFERENT
        # file from the CTranslate2 `model` above: `ggml-<name>.bin`, downloaded
        # from Hugging Face on first use (~142 MB for base.en) into
        # `<cacheDir>\ggml`. Options: tiny.en, base.en, small.en, medium.en,
        # large-v3-turbo, or a multilingual name paired with `language: auto`.
        whisperModel: base.en
        # Vulkan device index for the whisper.cpp engine. Pin it: ggml otherwise
        # takes the first device it enumerates, which on a desktop with an
        # integrated Radeon plus a discrete card may be the integrated one.
        # On this machine device 0 is the RX 9070 XT and device 1 the iGPU.
        ggmlDevice: 0
        # Ask whisper.cpp for the CPU explicitly. Leave false so a broken GPU
        # reports itself instead of quietly running three times slower.
        ggmlDisableGpu: false
        # Which accelerator to use for the faster-whisper engine.
        #
        #   auto  rank whatever this machine has: real cards before integrated
        #         ones, more VRAM first, and the CPU when nothing can accelerate
        #   gpu   require an accelerator; report why instead of silently
        #         falling back to the CPU
        #   cpu   pin the CPU
        device: auto
        # CTranslate2 compute type. Leave EMPTY to let the chosen device decide:
        # `float16` on an accelerator, `int8` on the CPU. Set it only to force a
        # specific precision (`int8`, `int8_float16`, `float16`, `float32`).
        computeType: ""
        # Beam width; 1 is greedy and fastest. Higher costs latency for accuracy.
        beamSize: 1
        # Worker threads for CPU decoding; 0 lets CTranslate2 decide.
        cpuThreads: 0
        # How long the loaded model stays resident with nothing to do, in
        # milliseconds. Keeping it warm removes the model-load cost (~1 s here)
        # from the next recording. 0 closes the worker as soon as it is idle.
        idleShutdownMs: 600000
        # Load the model at plugin activation instead of on the first recording.
        # On with the CPU engine so even the FIRST recording is sub-second: the
        # ~0.7 s load happens while DSH starts, not while the user waits.
        prewarm: true
        # Deadline for one transcription, in milliseconds.
        timeoutMs: 300000
        # Clean the transcript once it is recognized. Three modes:
        #
        #   conservative           clean WITHOUT spending reasoning tokens
        #                          (the default, and the fast one)
        #   conservative-reasoned  let the cleanup think, as it did before;
        #                          slower, for quality-comparison A/B only
        #   off                    return the recognizer's text untouched
        #
        # The cleanup uses the model this deployment already selects, so it needs
        # no second credential. It is strictly best-effort: any failure, timeout,
        # or implausibly large rewrite falls back to the raw transcript rather
        # than risk changing an instruction.
        #
        # TURNING IT OFF: set `polish: off` in your profile's cordis.patch.yml
        # (copy this whole `config` block — a row's config is replaced, never
        # deep-merged). Off is the right default for a deployment that wants the
        # draft to contain nothing but the recognizer's own words.
        polish: conservative
        # Reasoning effort for the cleanup call, one of off/low/high/max.
        #
        # LEAVE THIS AT off. A request that names no effort inherits the ADAPTER
        # default, which is `high` on a deployment that configures none, and this
        # plugin reads only text deltas — never reasoning deltas — so every
        # thinking token is time the user waits while nothing appears in the
        # draft, and the polishTimeoutMs deadline can expire before any cleaned
        # text exists to return. Removing filler words is mechanical work; the
        # reasoning buys nothing. `polish: conservative-reasoned` ignores this
        # key and restores the inherit-the-default behaviour.
        polishReasoning: off
        # Deadline for the cleanup call alone, in milliseconds.
        polishTimeoutMs: 15000
        # Pin the cleanup to a specific route instead of the current selection —
        # useful to keep cleanup on a small, cheap model while the agent runs a
        # large one. Both keys must be set together.
        # polishProvider: deepseek-official
        # polishModel: deepseek-v4-flash
        # Uncomment to override the engine location. By default the plugin uses
        # its own bundled worker and the interpreter that `python/setup.py` built
        # at `<package>/.venv`.
        # pythonPath: C:\path\to\python.exe
        # workerPath: C:\path\to\worker.py
        # scriptPath: C:\path\to\transcribe.py
        # cacheDir: C:\Users\you\.dsh\cache\voice-models
        # Device pins for a machine with more than one GPU. Both are read by the
        # accelerator runtime when the worker starts, so they must be set here
        # rather than at call time. On a Ryzen desktop with an integrated Radeon
        # plus a discrete card, the discrete card is usually index 1.
        #   hipVisibleDevices: "1"     # AMD / ROCm
        #   cudaVisibleDevices: "0"    # NVIDIA / CUDA
        # Override the reported GFX architecture when ROCm mis-detects a card.
        # gfxVersion: "12.0.1"
