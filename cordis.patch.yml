# Configuration layer of the `dsh-voice-input` bundle.
#
# ONE row, because Cordis parks a row until every service it declares exists and
# the boot audit fails on any entry left pending. The row hard-depends on
# shell/tools/fs (present in every base-backed profile) and DEFERS its browser
# route with `ctx.inject(['webServer'])`, so:
#
#   Web profile       tool + microphone route
#   headless / SDK    tool only, no pending entry, boot stays green
#
# Every field carries this plugin's own default, so most users never touch this
# layer: override the row from your profile's `cordis.patch.yml` instead. A row's
# whole `config` is replaced, never deep-merged, so restate every key you want.

- insert:
    - id: voice-input
      name: dsh-voice-input
      config:
        # Model size or name. `base.en` is ~150 MB and decodes about 6 s of
        # speech per second of CPU on a modern laptop. `small.en` is roughly
        # three times the compute for noticeably better accuracy.
        model: base.en
        # Spoken language code, or `auto` to detect it (multilingual models).
        language: en
        # CTranslate2 compute type; `int8` is the fast CPU default.
        computeType: int8
        # Deadline for one transcription, in milliseconds.
        timeoutMs: 300000
        # Uncomment to override the engine location. By default the plugin uses
        # its own bundled CLI and the interpreter that `python/setup.py` built
        # at `<package>/.venv`.
        # pythonPath: C:\path\to\python.exe
        # scriptPath: C:\path\to\transcribe.py
        # cacheDir: C:\Users\you\.dsh\cache\voice-models
